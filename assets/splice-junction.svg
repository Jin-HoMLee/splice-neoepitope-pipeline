<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" role="img" aria-label="Splice junction: two exons joined at the splice site, with the excised intron shown below as a dashed arc">
  <style>
    .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .exon-text { fill: #0a0e11; font-size: 19px; font-weight: 700; }
    .tag { fill: #0a0e11; font-size: 13px; font-weight: 600; }
    .intron { fill: #2f5146; font-size: 14px; font-weight: 600; }
  </style>
  <rect x="0" y="0" width="600" height="230" rx="14" fill="#ffffff" stroke="#0a0e11" stroke-opacity="0.18" stroke-width="2"/>
  <rect x="56" y="64" width="200" height="44" rx="9" fill="#c8f04a" stroke="#0a0e11" stroke-opacity="0.15" stroke-width="1.5"/>
  <rect x="344" y="64" width="200" height="44" rx="9" fill="#c8f04a" stroke="#0a0e11" stroke-opacity="0.15" stroke-width="1.5"/>
  <text x="156" y="92" text-anchor="middle" class="lbl exon-text">Exon 1</text>
  <text x="444" y="92" text-anchor="middle" class="lbl exon-text">Exon 2</text>
  <text x="56" y="56" class="lbl tag">5&#8242;</text>
  <text x="544" y="56" text-anchor="end" class="lbl tag">3&#8242;</text>
  <text x="300" y="34" text-anchor="middle" class="lbl tag">splice junction</text>
  <circle cx="300" cy="86" r="7" fill="#2f5146"/>
  <path d="M 256 108 C 256 196, 344 196, 344 108" fill="none" stroke="#2f5146" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/>
  <text x="300" y="216" text-anchor="middle" class="lbl intron">excised intron</text>
</svg>
